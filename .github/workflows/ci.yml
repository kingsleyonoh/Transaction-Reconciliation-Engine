name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recon
          POSTGRES_PASSWORD: recon_ci
          POSTGRES_DB: reconciliation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recon -d reconciliation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./internal/... -count=1 -v -race
        env:
          DATABASE_URL: postgres://recon:recon_ci@localhost:5432/reconciliation?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          API_KEY: ci-test-key
          PORT: "8080"
          USE_FIXTURES: "true"

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o /tmp/recon ./cmd/recon

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /apps/transaction-reconciliation-engine
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            echo "Waiting for health check..."
            sleep 10
            curl -sf http://localhost:8080/health || echo "WARNING: health check failed"

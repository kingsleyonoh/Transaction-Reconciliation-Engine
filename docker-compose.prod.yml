# Production deployment with Traefik reverse proxy
# Deploy: docker compose -f docker-compose.prod.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: recon-engine
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - traefik-public
    labels:
      # Traefik auto-discovery
      - "traefik.enable=true"
      - "traefik.http.routers.recon-engine.rule=Host(`recon-engine.kingsleyonoh.com`)"
      - "traefik.http.routers.recon-engine.entrypoints=websecure"
      - "traefik.http.routers.recon-engine.tls.certresolver=letsencrypt"
      - "traefik.http.services.recon-engine.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik-public:
    external: true
